# Sherm Map v2. Secrets kommen aus .env neben dieser Datei (Vorlage: .env.example).
# Das Schema legt das Backend beim Start selbst an bzw. migriert es (db/migrations).
services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in .env}
    ports:
      - "127.0.0.1:5432:5432"   # nur lokal auf dem Host erreichbar, nicht aus dem Internet
    networks:
      - default
    volumes:
      - ${PGDATA_DIR:-/opt/nfs/sherm-map/pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sherm-map:latest
    container_name: sherm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1   # Traefik davor
      PUBLIC_URL: ${PUBLIC_URL:-https://map.sherm.fun}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HASH_SECRET: ${HASH_SECRET:?HASH_SECRET fehlt in .env}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASS: ${ADMIN_PASS:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}     # neue Sherms/Meldungen an z.B. n8n
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-https://sherm.fun https://www.sherm.fun}   # dürfen die Karte per iframe einbetten
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sherm.entrypoints=http"
      - "traefik.http.routers.sherm.rule=Host(`map.sherm.fun`)"    ##eure domain
      - "traefik.http.routers.sherm.middlewares=redirect@file"
      - "traefik.http.routers.sherm-secure.rule=Host(`map.sherm.fun`)"    ##eure domain
      - "traefik.http.routers.sherm-secure.entrypoints=https"
      - "traefik.http.routers.sherm-secure.tls=true"
      - "traefik.http.routers.sherm-secure.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.sherm-secure.service=sherm"
      - "traefik.http.services.sherm.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    volumes:
      # Gehört User 1000 (node im Container): einmalig chown -R 1000:1000 <ordner> auf dem Host
      - ${UPLOADS_DIR:-/opt/nfs/sherm-map/uploads}:/app/uploads
      # Nur lesend, damit das Admin-Panel den Backup-Status zeigen kann (scripts/backup.sh schreibt dorthin)
      - ${BACKUP_DIR:-./backups}:/app/backups:ro

networks:
  proxy:
    external: true
